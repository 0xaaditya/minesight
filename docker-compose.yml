services:
  postgres:
    image: postgres:16
    container_name: minesight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minesight
      POSTGRES_USER: minesight
      POSTGRES_PASSWORD: minesight
    ports:
      - "5432:5432"   # exposed for local psql/alembic access during dev
    volumes:
      - postgres-data:/var/lib/postgresql/data

  traccar:
    image: traccar/traccar:latest
    container_name: minesight-traccar
    restart: unless-stopped
    ports:
      - "8082:8082"   # web UI + REST API
      - "5055:5055"   # OsmAnd protocol (ESP32 firmware talks to this one)
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: minesight-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://minesight:minesight@postgres:5432/minesight
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  traccar-data:
  traccar-logs:
  postgres-data:
